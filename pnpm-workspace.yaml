packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@hugeicons/react": 1.1.10
  "@hugeicons/core-free-icons": 4.3.4
  "react": 19.3.0
  "react-dom": 19.3.0
  "radix-ui": 1.6.7
  "class-variance-authority": 0.7.1
  "clsx": 2.1.1
  "tailwind-merge": 3.7.0
  "lucide-react": 1.47.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "esbuild": 0.28.2
  "postcss": 8.5.28
  "@tailwindcss/postcss": 4.3.3
  "tailwindcss": 4.3.3
  "@types/node": 24.12.4
  typescript: 7.0.2
  zod: 4.1.8
  marked: 18.0.13
  dompurify: 3.4.15
  cmdk: 1.1.1
  "tw-animate-css": 1.4.0

# Published Core scripts set executable permissions and remove macOS quarantine.
allowBuilds:
  esbuild: true
  "@lark-codem/codem-core-darwin-arm64": true
  "@lark-codem/codem-core-darwin-x64": true
  "@lark-codem/codem-core-linux-arm64-gnu": true
  "@lark-codem/codem-core-linux-x64-gnu": true
  "@lark-codem/codem-core-win32-arm64-gnu": true
  "@lark-codem/codem-core-win32-x64-msvc": true
  # Local VSIX packaging does not sign or publish extensions.
  "@vscode/vsce-sign": false

minimumReleaseAgeExclude:
  - '@lark-codem/codem-core-darwin-arm64@0.8.47'
  - '@lark-codem/codem-core-darwin-x64@0.8.47'
  - '@lark-codem/codem-core-linux-arm64-gnu@0.8.47'
  - '@lark-codem/codem-core-linux-x64-gnu@0.8.47'
  - '@lark-codem/codem-core-win32-arm64-gnu@0.8.47'
  - '@lark-codem/codem-core-win32-x64-msvc@0.8.47'
  - '@lark-codem/codem-core@0.8.47'
