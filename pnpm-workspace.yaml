packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@types/node": 24.12.4
  typescript: 7.0.2
  zod: 4.1.8

# Published Core scripts set executable permissions and remove macOS quarantine.
allowBuilds:
  esbuild: true
  "@lark-codem/codem-core-darwin-arm64": true
  "@lark-codem/codem-core-darwin-x64": true
  "@lark-codem/codem-core-linux-arm64-gnu": true
  "@lark-codem/codem-core-linux-x64-gnu": true
  "@lark-codem/codem-core-win32-arm64-gnu": true
  "@lark-codem/codem-core-win32-x64-msvc": true
  # Local VSIX packaging does not sign or publish extensions.
  "@vscode/vsce-sign": false

minimumReleaseAgeExclude:
  - '@lark-codem/codem-core-darwin-arm64@0.8.45'
  - '@lark-codem/codem-core-darwin-x64@0.8.45'
  - '@lark-codem/codem-core-linux-arm64-gnu@0.8.45'
  - '@lark-codem/codem-core-linux-x64-gnu@0.8.45'
  - '@lark-codem/codem-core-win32-arm64-gnu@0.8.45'
  - '@lark-codem/codem-core-win32-x64-msvc@0.8.45'
  - '@lark-codem/codem-core@0.8.45'
